---
- name: Validate Seerr container inputs
  ansible.builtin.assert:
    that:
      - seerr_image | length > 0
      - seerr_port | int > 0
      - seerr_config_directory is match('^/')
    fail_msg: Seerr requires a pinned image, valid port and absolute config path.

- name: Stop the native Seerr service if present
  ansible.builtin.systemd:
    name: seerr
    state: stopped
    enabled: false
  become: true
  failed_when: false

- name: Remove failed native Seerr installation artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/seerr.service
    - /etc/apt/sources.list.d/nodesource.sources
    - /etc/apt/keyrings/nodesource.asc
    - /etc/apt/keyrings/nodesource.gpg
    - "{{ seerr_root }}/current"
    - "{{ seerr_root }}/versions"
  become: true

- name: Reload systemd after removing native Seerr unit
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Install shared Docker host baseline
  ansible.builtin.include_role:
    name: docker-host

- name: Remove native Seerr build toolchain
  ansible.builtin.apt:
    name: [nodejs, git, make, g++]
    state: absent
  become: true

- name: Create Seerr application directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ seerr_root }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ seerr_config_directory }}", owner: "{{ seerr_container_uid }}", group: "{{ seerr_container_gid }}", mode: "0750" }
  become: true

- name: Deploy pinned Seerr Compose project
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ seerr_root }}/compose.yml"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart Seerr

- name: Install Seerr Compose systemd service
  ansible.builtin.template:
    src: seerr-compose.service.j2
    dest: /etc/systemd/system/seerr.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart Seerr

- name: Enable and start Seerr
  ansible.builtin.systemd:
    name: seerr
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: Apply pending Seerr restart before health check
  ansible.builtin.meta: flush_handlers

- name: Verify Seerr responds
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ seerr_port }}/api/v1/status"
    status_code: 200
    return_content: false
  register: seerr_health
  retries: 20
  delay: 3
  until: seerr_health is succeeded
