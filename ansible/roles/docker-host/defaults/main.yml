---
docker_host_supported_architectures: [x86_64, aarch64]
docker_host_architecture_map:
  x86_64: amd64
  aarch64: arm64
docker_host_apt_key_url: https://download.docker.com/linux/debian/gpg
docker_host_apt_key_path: /etc/apt/keyrings/docker.asc
docker_host_apt_key_fingerprint: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
docker_host_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
docker_host_daemon_config:
  log-driver: json-file
  log-opts:
    max-size: 10m
    max-file: "3"
