---
- name: Add Tailscale APT key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/debian/bookworm.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Remove legacy Tailscale repository definitions
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/tailscale.list
    - /etc/apt/sources.list.d/pkgs_tailscale_com_stable_debian.list
  become: true

- name: Configure Tailscale APT repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: [deb]
    uris: [https://pkgs.tailscale.com/stable/debian]
    suites: [bookworm]
    components: [main]
    signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
    state: present
  become: true

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
  become: true

- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding
  become: true

- name: Check current Tailscale status
  ansible.builtin.command:
    argv: [tailscale, status, --json]
  register: ts_status
  changed_when: false
  failed_when: false
  become: true

- name: Bring up Tailscale
  ansible.builtin.command:
    argv: >-
      {{
        ['tailscale', 'up', '--reset', '--authkey=' + tailscale_authkey,
         '--accept-dns=false', '--hostname=' + inventory_hostname]
        + (['--advertise-routes=' + tailscale_advertise_routes]
           if tailscale_advertise_routes else [])
      }}
  become: true
  no_log: true
  when: >
    ts_status.rc != 0 or
    '"BackendState":"Running"' not in ts_status.stdout
