---
- name: Install Docker
  ansible.builtin.include_role:
    name: docker-host

- name: Validate qBittorrent inputs
  ansible.builtin.assert:
    that:
      - qbittorrent_directory is match('^/')
      - qbittorrent_webui_port | int > 0
      - protonvpn_wireguard_key | length > 0

- name: Create qBittorrent directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ qbittorrent_uid }}"
    group: "{{ qbittorrent_gid }}"
    mode: "0770"
  loop:
    - "{{ qbittorrent_directory }}"
    - "{{ qbittorrent_directory }}/config"
    - "{{ qbittorrent_directory }}/gluetun"
  become: true

- name: Deploy qBittorrent Compose stack
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ qbittorrent_directory }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  become: true
  notify: Restart qBittorrent stack

- name: Install qBittorrent stack service
  ansible.builtin.template:
    src: qbittorrent-stack.service.j2
    dest: /etc/systemd/system/qbittorrent-stack.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart qBittorrent stack

- name: Apply pending qBittorrent stack changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start qBittorrent stack
  ansible.builtin.systemd:
    name: qbittorrent-stack
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Wait for qBittorrent web interface
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ qbittorrent_webui_port }}/"
    status_code: [200, 302, 401, 403]
  register: qbittorrent_health
  retries: 20
  delay: 3
  until: qbittorrent_health is succeeded
